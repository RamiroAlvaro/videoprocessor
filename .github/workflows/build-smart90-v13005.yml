name: Build v1.3.005 Smart90 DisneyFix package

run-name: Build v1.3.005 Smart90 DisneyFix package

on:
  workflow_dispatch:
  push:
    branches:
      - fix/disney-eotf-restart-race-v1.3.005

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout DisneyFix integration branch
        uses: actions/checkout@v4
        with:
          ref: fix/disney-eotf-restart-race-v1.3.005
          fetch-depth: 0

      - name: Verify base and diff hygiene
        id: revision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sha = git rev-parse HEAD
          $shortSha = git rev-parse --short HEAD
          git merge-base --is-ancestor origin/v1.3.005-beta HEAD
          if ($LASTEXITCODE -ne 0) { throw "Branch is not based on v1.3.005-beta" }
          git diff --check origin/v1.3.005-beta..HEAD
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }
          Write-Host "Repository : RamiroAlvaro/videoprocessor"
          Write-Host "Base       : origin/v1.3.005-beta"
          Write-Host "Branch     : fix/disney-eotf-restart-race-v1.3.005"
          Write-Host "Commit     : $sha"
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Validate Smart90 configuration structure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = ".\VideoProcessor.cfg"
          if (-not (Test-Path $path)) { throw "VideoProcessor.cfg missing" }
          $section = "<root>"
          $seen = @{}
          $lineNo = 0
          foreach ($line in Get-Content $path) {
            $lineNo++
            $text = $line.Trim()
            if ($text.Length -eq 0 -or $text.StartsWith("#")) { continue }
            if ($text -match '^\[([^\]]+)\]$') {
              $section = $Matches[1]
              if (-not $seen.ContainsKey($section)) { $seen[$section] = @{} }
              continue
            }
            if ($text -match '^([^:]+):') {
              $key = $Matches[1].Trim().ToLowerInvariant()
              if (-not $seen.ContainsKey($section)) { $seen[$section] = @{} }
              if ($seen[$section].ContainsKey($key)) {
                throw "Duplicate config key [$section] '$key' at line $lineNo"
              }
              $seen[$section][$key] = $lineNo
            }
          }
          $cfg = Get-Content $path -Raw
          foreach ($required in @(
            "default_shortcut: N",
            "shortcut: O",
            "label: NLS+ Smart 90",
            "hlsl_file: NLSPlus.hlsl",
            "target_fill: 0.90",
            "active_aspect_min: 2.30"
          )) {
            if (-not $cfg.Contains($required)) { throw "Missing Smart90 config token: $required" }
          }
          if (-not (Test-Path ".\shaders\NLSPlus.hlsl")) { throw "NLSPlus.hlsl missing" }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply field-tested Smart90 presentation-state hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = ".\src\VideoProcessor-Lib\microsoft_directshow\video_renderers\DirectShowGenericHDRVideoRenderer.cpp"
          $text = [System.IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $oldSelect = "`tm_requestedRuleUsesNlsMapping = nlsMapping;`n`tApplyVideoWindowPlacement();`n"
          $newSelect = "`tm_requestedRuleUsesNlsMapping = nlsMapping;`n`tif (!nlsMapping)`n`t`tApplyVideoWindowPlacement();`n"
          $selectCount = ([regex]::Matches($text, [regex]::Escape($oldSelect))).Count
          if ($selectCount -ne 1) { throw "Expected one pre-decision placement call, found $selectCount" }
          $text = $text.Replace($oldSelect, $newSelect)
          $oldDecision = "`t`tm_nlsTargetAspect = decision.targetAspect;`n`t`tUpdateNlsOsdMode(decision.mode);`n"
          $newDecision = "`t`tm_nlsTargetAspect = decision.targetAspect;`n`t`tUpdateNlsOsdMode(decision.mode);`n`t`tApplyVideoWindowPlacement();`n"
          $decisionCount = ([regex]::Matches($text, [regex]::Escape($oldDecision))).Count
          if ($decisionCount -ne 2) { throw "Expected two coherent NLS decision sites, found $decisionCount" }
          $text = $text.Replace($oldDecision, $newDecision)
          $oldViewport = "`tMadVRShaderLoader::SetRuntimeNlsTargetAspect(m_nlsTargetAspect);`n`tApplyVideoWindowPlacement();`n"
          $newViewport = "`tMadVRShaderLoader::SetRuntimeNlsTargetAspect(m_nlsTargetAspect);`n`tif (!m_requestedRuleUsesNlsMapping)`n`t`tApplyVideoWindowPlacement();`n"
          $viewportCount = ([regex]::Matches($text, [regex]::Escape($oldViewport))).Count
          if ($viewportCount -ne 1) { throw "Expected one pre-refresh viewport placement call, found $viewportCount" }
          $text = $text.Replace($oldViewport, $newViewport)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Smart90 hotfix diff check failed" }

      - name: Apply Disney Plus EOTF restart coalescing hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = ".\src\VideoProcessor-GUI\VideoProcessorDlg.cpp"
          $text = [System.IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $old = "`t`t`tm_eotfCheckCooldownSeconds == 0 &&  // Cooldown expired`n`t`t`tm_captureDeviceVideoState &&`n"
          $new = "`t`t`tm_eotfCheckCooldownSeconds == 0 &&  // Cooldown expired`n`t`t`tm_eotfChangeRestartCooldownSeconds < 0 &&  // Raw EOTF stabilization owns this transition`n`t`t`tm_captureDeviceVideoState &&`n"
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one legacy EOTF polling detector, found $count" }
          $text = $text.Replace($old, $new)
          if (-not $text.Contains("m_eotfChangeRestartCooldownSeconds < 0 &&  // Raw EOTF stabilization owns this transition")) {
            throw "Disney Plus EOTF coalescing guard was not applied"
          }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Disney Plus hotfix diff check failed" }
          Write-Host "Disney Plus EOTF coalescing guard applied: legacy capture-restart fallback is suppressed while the stabilized renderer restart is pending."

      - name: Validate Disney Plus EOTF fix source contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = ".\src\VideoProcessor-GUI\VideoProcessorDlg.cpp"
          $text = [System.IO.File]::ReadAllText($path)
          $guard = "m_eotfChangeRestartCooldownSeconds < 0 &&  // Raw EOTF stabilization owns this transition"
          $guardCount = ([regex]::Matches($text, [regex]::Escape($guard))).Count
          if ($guardCount -ne 1) { throw "Expected one Disney Plus EOTF coalescing guard, found $guardCount" }
          foreach ($required in @(
            "EOTF change detected: %s -> %s - renderer restart in 3 seconds",
            "m_eotfChangeRestartCooldownSeconds = 5;",
            "SetTimer(EOTF_CHANGE_RESTART_TIMER_ID, 1000, nullptr)",
            "m_wantToRestartCapture = true;"
          )) {
            if (-not $text.Contains($required)) { throw "EOTF lifecycle contract token missing: $required" }
          }
          Write-Host "EOTF lifecycle contract validated: stabilized renderer restart remains intact; only duplicate legacy escalation is gated."

      - name: Install required Visual Studio components
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installPath) { throw "Visual Studio installation not found" }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $arguments = @(
            "modify", "--installPath", "`"$installPath`"",
            "--add", "Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64",
            "--add", "Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC",
            "--add", "Microsoft.VisualStudio.Component.Windows10SDK.19041",
            "--add", "Microsoft.VisualStudio.Component.Windows11SDK.26100",
            "--quiet", "--norestart"
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) { throw "Visual Studio Installer failed: $($process.ExitCode)" }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Qt 6.8.3 for Config editor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\bootstrap-config-editor-qt.ps1

      - name: Build VideoProcessor GUI x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild .\src\VideoProcessor-GUI\VideoProcessor-GUI.vcxproj /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Build VP Renderer x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild .\src\VideoProcessor-VPRenderer\VideoProcessor-VPRenderer.vcxproj /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Build Config Discovery x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild .\src\VideoProcessor-ConfigDiscovery\VideoProcessor-ConfigDiscovery.vcxproj /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Build Config Editor x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild .\src\VideoProcessor-Config\VideoProcessor-Config.vcxproj /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Prepare canonical build root
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildRoot = Join-Path $env:GITHUB_WORKSPACE "x64\Release"
          if (Test-Path $buildRoot) { Remove-Item $buildRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $buildRoot -Force | Out-Null
          $gui = Get-ChildItem . -Filter "VideoProcessor-GUI.exe" -File -Recurse | Select-Object -First 1
          if (-not $gui) { $gui = Get-ChildItem . -Filter "VideoProcessor.exe" -File -Recurse | Select-Object -First 1 }
          if (-not $gui) { throw "VideoProcessor GUI executable not found" }
          Copy-Item $gui.FullName (Join-Path $buildRoot "VideoProcessor-GUI.exe") -Force
          $configExe = Get-ChildItem .\src\VideoProcessor-Config -Filter "VideoProcessorConfig.exe" -File -Recurse | Select-Object -First 1
          if (-not $configExe) { throw "VideoProcessorConfig.exe not found" }
          $configDir = $configExe.Directory.FullName
          Copy-Item $configExe.FullName (Join-Path $buildRoot "VideoProcessorConfig.exe") -Force
          $discovery = Get-ChildItem $configDir -Filter "VideoProcessorConfigDiscovery.dll" -File | Select-Object -First 1
          if (-not $discovery) { $discovery = Get-ChildItem .\src\VideoProcessor-ConfigDiscovery -Filter "VideoProcessorConfigDiscovery.dll" -File -Recurse | Select-Object -First 1 }
          if (-not $discovery) { throw "VideoProcessorConfigDiscovery.dll not found" }
          Copy-Item $discovery.FullName (Join-Path $buildRoot "VideoProcessorConfigDiscovery.dll") -Force
          Get-ChildItem $configDir -Filter "Qt6*.dll" -File | ForEach-Object { Copy-Item $_.FullName $buildRoot -Force }
          if (Test-Path (Join-Path $configDir "opengl32sw.dll")) { Copy-Item (Join-Path $buildRoot "opengl32sw.dll") -Force }
          foreach ($dir in @("generic","iconengines","imageformats","networkinformation","platforms","styles","tls")) {
            $source = Join-Path $configDir $dir
            if (Test-Path $source) { Copy-Item $source (Join-Path $buildRoot $dir) -Recurse -Force }
          }
          $renderer = Get-ChildItem . -Filter "VideoProcessorVPRenderer.dll" -File -Recurse | Select-Object -First 1
          if (-not $renderer) { throw "VideoProcessorVPRenderer.dll not found" }
          New-Item -ItemType Directory -Path (Join-Path $buildRoot "vprenderer") -Force | Out-Null
          Copy-Item $renderer.FullName (Join-Path $buildRoot "vprenderer\VideoProcessorVPRenderer.dll") -Force

      - name: Build official release staging tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\package_release.ps1

      - name: Add NLSPlus HLSL to release tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $shaderDir = ".\artifacts\release\VideoProcessor\shaders"
          Copy-Item ".\shaders\NLSPlus.hlsl" (Join-Path $shaderDir "NLSPlus.hlsl") -Force
          if (-not (Test-Path (Join-Path $shaderDir "NLSPlus.hlsl"))) { throw "NLSPlus.hlsl was not staged" }

      - name: Validate packaged Smart90 config
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $example = ".\artifacts\release\VideoProcessor\VideoProcessor.cfg.example"
          if (-not (Test-Path $example)) { throw "Packaged cfg example missing" }
          $cfg = Get-Content $example -Raw
          if (-not $cfg.Contains("label: NLS+ Smart 90")) { throw "Packaged cfg is not Smart90" }
          if (-not $cfg.Contains("target_fill: 0.90")) { throw "Packaged cfg lost target_fill" }

      - name: Create full ZIP
        id: zip
        shell: pwsh
        env:
          VP_SHORT_SHA: ${{ steps.revision.outputs.short_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $zipName = "VideoProcessor-v1.3.005-beta-Smart90-DisneyFix-$env:VP_SHORT_SHA-x64.zip"
          Compress-Archive -Path .\artifacts\release\VideoProcessor\* -DestinationPath ".\$zipName" -Force
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoProcessor-v1.3.005-beta-Smart90-DisneyFix-${{ steps.revision.outputs.short_sha }}-x64
          path: ${{ steps.zip.outputs.zip_name }}
          retention-days: 14

      - name: Build summary
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## VideoProcessor v1.3.005-beta + NLS+ Smart 90 + Disney EOTF restart fix"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "- Base: ``v1.3.005-beta``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Branch: ``fix/disney-eotf-restart-race-v1.3.005``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Commit: ``${{ steps.revision.outputs.sha }}``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Smart90 config duplicate-key guard: passed"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Disney EOTF restart coalescing guard: passed"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Full x64 release ZIP uploaded as artifact"
