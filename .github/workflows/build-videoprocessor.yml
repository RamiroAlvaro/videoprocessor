name: Build VideoProcessor v1.2.001-beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show source revision
        shell: pwsh
        run: |
          git log -1 --oneline
          git status

      - name: Install required VS2019 components
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $installPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -property installationPath

          if (-not $installPath) {
            throw "Visual Studio installation not found"
          }

          Write-Host "Visual Studio installation: $installPath"

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          $arguments = @(
            "modify",
            "--installPath", "`"$installPath`"",
            "--add", "Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64",
            "--add", "Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC",
            "--add", "Microsoft.VisualStudio.Component.Windows10SDK.19041",
            "--add", "Microsoft.VisualStudio.Component.Windows11SDK.26100",
            "--quiet",
            "--norestart"
          )

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "Visual Studio Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            throw "Visual Studio Installer failed with exit code $($process.ExitCode)"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show MSBuild version
        shell: pwsh
        run: |
          msbuild -version

      - name: Build VideoProcessor GUI x64 Release
        shell: pwsh
        run: |
          msbuild .\src\VideoProcessor-GUI\VideoProcessor-GUI.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

      - name: Build VP Renderer x64 Release
        shell: pwsh
        run: |
          msbuild .\src\VideoProcessor-VPRenderer\VideoProcessor-VPRenderer.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

      - name: Prepare distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Searching compiled VideoProcessor files..."

          $exe = Get-ChildItem `
            -Path . `
            -Filter "VideoProcessor.exe" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "VideoProcessor.exe was not found"
          }

          $renderer = Get-ChildItem `
            -Path . `
            -Filter "VideoProcessorVPRenderer.dll" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $renderer) {
            throw "VideoProcessorVPRenderer.dll was not found"
          }

          Write-Host "GUI executable found at:"
          Write-Host $exe.FullName

          Write-Host "VP Renderer found at:"
          Write-Host $renderer.FullName

          New-Item `
            -ItemType Directory `
            -Path .\dist `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path .\dist\vprenderer `
            -Force | Out-Null

          Write-Host "Copying complete GUI output..."
          Copy-Item `
            -Path "$($exe.Directory.FullName)\*" `
            -Destination .\dist `
            -Recurse `
            -Force

          Write-Host "Copying complete VP Renderer output..."
          Copy-Item `
            -Path "$($renderer.Directory.FullName)\*" `
            -Destination .\dist\vprenderer `
            -Recurse `
            -Force

          if (Test-Path .\VideoProcessor.cfg) {
            Copy-Item `
              .\VideoProcessor.cfg `
              .\dist\VideoProcessor.cfg `
              -Force
          }

          if (Test-Path .\CONFIGURATION.html) {
            Copy-Item `
              .\CONFIGURATION.html `
              .\dist\CONFIGURATION.html `
              -Force
          }

          if (Test-Path .\shaders) {
            Copy-Item `
              .\shaders `
              .\dist\shaders `
              -Recurse `
              -Force
          }

          git rev-parse HEAD |
            Out-File `
              .\dist\BUILD_COMMIT.txt `
              -Encoding ascii

          Write-Host "=== FINAL DISTRIBUTION ==="
          Get-ChildItem .\dist -Recurse |
            Select-Object FullName

      - name: Package build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\dist\* `
            -DestinationPath .\VideoProcessor-v1.2.001-beta-x64.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoProcessor-v1.2.001-beta-x64
          path: VideoProcessor-v1.2.001-beta-x64.zip
          retention-days: 14
