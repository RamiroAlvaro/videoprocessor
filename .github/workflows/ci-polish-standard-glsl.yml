name: Validate final standard GLSL polish

on:
  push:
    branches:
      - work/vprenderer-standard-glsl

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/vprenderer-standard-glsl
          fetch-depth: 0

      - name: Apply final polish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch origin feature/vprenderer-standard-glsl
          python .\ci_polish_standard_glsl.py
          if ($LASTEXITCODE -ne 0) { throw "Polish staging failed with exit code $LASTEXITCODE" }
          git checkout origin/feature/vprenderer-standard-glsl -- .\3rdparty\blackmagic_decklink\DeckLinkAPI_h.h
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }
          git status --short

      - name: Install required Visual Studio components
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -property installationPath
          if (-not $installPath) { throw "Visual Studio installation not found" }

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $arguments = @(
            "modify",
            "--installPath", "`"$installPath`"",
            "--add", "Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64",
            "--add", "Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC",
            "--add", "Microsoft.VisualStudio.Component.Windows10SDK.19041",
            "--add", "Microsoft.VisualStudio.Component.Windows11SDK.26100",
            "--quiet",
            "--norestart"
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            throw "Visual Studio Installer failed with exit code $($process.ExitCode)"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build VP Renderer x64 Release
        shell: pwsh
        run: |
          msbuild .\src\VideoProcessor-VPRenderer\VideoProcessor-VPRenderer.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "VP Renderer build failed with exit code $LASTEXITCODE" }

      - name: Build native tests x64 Release
        shell: pwsh
        run: |
          msbuild .\src\VideoProcessor-Test\VideoProcessor-Test.vcxproj.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "Native test build failed with exit code $LASTEXITCODE" }

      - name: Run native tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -property installationPath
          $vstest = Join-Path $installPath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
          if (-not (Test-Path $vstest)) { throw "vstest.console.exe not found" }

          $testDll = Get-ChildItem . -Filter "VideoProcessor-Test.dll" -File -Recurse |
            Where-Object { $_.FullName -match "x64|Release" } |
            Select-Object -First 1
          if (-not $testDll) { throw "VideoProcessor-Test.dll not found" }

          & $vstest $testDll.FullName
          if ($LASTEXITCODE -ne 0) { throw "Native tests failed with exit code $LASTEXITCODE" }

      - name: Validate final diff and shader package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content .\packaging\release-manifest.json -Raw | ConvertFrom-Json
          $shaderFiles = @($manifest.files | Where-Object { $_.destination -like "shaders/*" })
          if ($shaderFiles.Count -ne 8) { throw "Expected 8 packaged shaders, found $($shaderFiles.Count)" }
          foreach ($entry in $shaderFiles) {
            if (-not (Test-Path $entry.source)) { throw "Missing packaged shader: $($entry.source)" }
          }
          if (-not (Select-String -Path '.\shaders\Adaptive sharpen.glsl' -Pattern '//!HOOK OUTPUT' -SimpleMatch -Quiet)) {
            throw "Adaptive Sharpen does not declare //!HOOK OUTPUT"
          }
          if (-not (Select-String -Path '.\shaders\Adaptive sharpen.glsl' -Pattern '{{strength}}' -SimpleMatch -Quiet)) {
            throw "Adaptive Sharpen strength placeholder missing"
          }
          if (-not (Select-String -Path '.\shaders\Adaptive sharpen.glsl' -Pattern 'gist.github.com/igv/8a77e4eb8276753b54bb94c1c50c317e' -SimpleMatch -Quiet)) {
            throw "Adaptive Sharpen provenance is missing"
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Final git diff --check failed" }
          git diff --exit-code origin/feature/vprenderer-standard-glsl -- .\3rdparty\blackmagic_decklink\DeckLinkAPI_h.h
          if ($LASTEXITCODE -ne 0) { throw "Generated DeckLink header differs from feature base" }

      - name: Commit validated polish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .\ci_polish_standard_glsl.py
          git rm .\.github\workflows\ci-polish-standard-glsl.yml
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "Staged diff check failed" }
          git commit -m "Polish standard GLSL validation"
          if ($LASTEXITCODE -ne 0) { throw "Commit failed with exit code $LASTEXITCODE" }
          git push origin HEAD:work/vprenderer-standard-glsl
          if ($LASTEXITCODE -ne 0) { throw "Push failed with exit code $LASTEXITCODE" }
