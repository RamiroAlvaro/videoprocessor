# VideoProcessor release sample configuration
#
# This file is read at startup from the same directory as VideoProcessor.exe.
# Leave a setting commented out unless it is appropriate for your hardware.

[general]
capture_device: DeckLink Quad HDMI Recorder (1)
renderer: VP Renderer
hide_legacy_renderers: true
fullscreen: false
windowed_fullscreen_mode: false
noui: false
startminimized: false
scene_detect: false
switch_refresh_rate: true
profile_change_display_seconds: 5
hdr_colorspace: FOLLOW_INPUT
hdr_luminance: FOLLOW_INPUT

[decklink]
rgb_8bit_packing: AUTO
rgb_10bit_packing: AUTO
rgb_12bit_packing: AUTO

[queue.Normal]
queue_size: 32
lead_frames: 4
startup_preroll_frames: 0
target_frames: 3
shortcut: Shift+Q

[queue.Low_Latency]
queue_size: 1
lead_frames: 1
startup_preroll_frames: 0
target_frames: 1
reset_queue_too_large_percent: 200
shortcut: Shift+L

[directshow]
# madVR black-bar detection on DeckLink v210 capture requires a renderer-friendly
# 10-bit surface. This conversion is the tested DirectShow/madVR path.
video_conversion: V210_TO_P010
renderer_start_stop_time_method: CLOCK_SMART
frame_offset: AUTO
renderer_nominal_range: AUTO

[directshow.conversion]
conversion_method: SIMD
min_core_count: 1
max_core_count: 2

[directshow.ppm]
ppm: AUTO

[lldv]

[logging]

[vprenderer.Default]
display_bit_depth: AUTO
sdr_target_nits: 100

[vprenderer.output.Default]
output_presentation: AUTO
output_range: AUTO

[vprenderer.color.Rec709]
output_gamma: AUTO
sdr_target_primaries: REC709
report_bt2020_to_display: false
sdr_adjust_gamma: ON

shortcut: F5
[vprenderer.color.BT2020]
output_gamma: AUTO
sdr_target_primaries: BT2020
report_bt2020_to_display: true

shortcut: F6
[vprenderer.viewport.viewport_16x9]
label: 16x9
subtitle_fit: false
hdr_peak_analysis_picture_only: false
hdr_peak_analysis_motion_compensation: false
hdr_peak_analysis_height_percent: 75
screen_aspect: 16:9
vertical_alignment: center
subtitle_engage_drift_ms: 0
subtitle_release_drift_ms: 2000
subtitle_padding_pixels: 35
subtitle_target_buffer_pixels: 10
automatic_crop: false

shortcut: F3
[vprenderer.viewport.scope]
label: Scope
screen_aspect: 2.35:1
vertical_alignment: center
subtitle_fit: true
automatic_crop: true

shortcut: F2
[shader.nls]
# Start each VP process with Smart 90 selected. O remains an explicit Off for
# the rest of that process; N re-selects Smart 90. Restarting VP restores this
# default without changing the existing runtime shortcut semantics.
default_shortcut: N
shortcut: O

shortcut: Shift+N
[shader.nls.standard]
shader_type: nls
label: Nonlinear Stretch
stage: pre_resize
order: 10
hlsl_file: NLS.hlsl
glsl_file: NLS.glsl
quality: high
geometry: classic
strength: 1.0
curve: 2.0
tolerance_percent: 5
max_stretch_ratio: 1.4
aspect_direction: narrower_only
vprenderer_max_crop_percent: 0
vprenderer_crop_preference: preserve_image

shortcut: Shift+P
[shader.nls.protected]
shader_type: nls
label: Nonlinear Stretch Protected
stage: pre_resize
order: 10
hlsl_file: NLS.hlsl
glsl_file: NLS.glsl
quality: high
geometry: protected
max_stretch_ratio: 1.4
strength: 1.0
center_protection: 0.35
curve: 2.0
tolerance_percent: 5
aspect_direction: narrower_only
vprenderer_max_crop_percent: 0
vprenderer_crop_preference: preserve_image

[shader.nls.plus]
shader_type: nls
label: NLS+ Smart 90
stage: pre_resize
order: 11
hlsl_file: NLSPlus.hlsl
glsl_file: NLSPlus.glsl
# Fixed 16:9 Smart 90 profile. The HLSL derives crop from source geometry and
# limits nonlinear residual correction to 1.08x; no hand tuning is intended.
quality: medium
target_fill: 0.90
tolerance_percent: 2
max_stretch_ratio: 1.4
aspect_direction: wider_only
# Keep intermediate and native formats untouched while Smart 90 remains armed.
active_aspect_min: 2.30
# VP Renderer keeps its equivalent crop budget explicit. madVR's HLSL computes
# its own geometry-derived crop, reaching ~5.56% per side for 2.40:1 -> 90%.
vprenderer_max_crop_percent: 5.6
vprenderer_crop_preference: minimize_distortion
shortcut: N

[shader.nls.vertical]
shader_type: nls
label: NLS-V
stage: pre_resize
order: 12
glsl_file: NLS.glsl
quality: high
geometry: protected
strength: 1.0
center_protection: 0.35
curve: 2.0
tolerance_percent: 5
max_stretch_ratio: 1.22
aspect_direction: wider_only
vprenderer_max_crop_percent: 6
vprenderer_crop_preference: preserve_image

[shader.standard]
type: multi

[shader.standard.debanding_mild]
shader_type: custom
label: Debanding Mild
stage: pre_resize
order: 10
hlsl_file: Debanding mild.hlsl

[shader.standard.denoise]
shader_type: custom
label: Denoise
stage: pre_resize
order: 20
hlsl_file: Denoise.hlsl

[shader.standard.adaptive_sharpen]
shader_type: custom
label: Adaptive Sharpen
stage: post_resize
order: 10
hlsl_file: Adaptive sharpen.hlsl

[shader.standard.invert]
shader_type: custom
label: Invert
stage: post_resize
order: 20
hlsl_file: Invert.hlsl

[shortcuts]
foreground_only: false
render.1: Shift+A
